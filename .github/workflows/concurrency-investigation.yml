name: Concurrency investigation

# Branch-limited test-only experiment; does not deploy or replace required CI.
on:
  push:
    branches: [fix/windows-concurrency]
    paths:
      - app/tests/scope_experiment.py
      - app/tests/test_scope_experiment.py
      - .github/workflows/concurrency-investigation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Scope ${{ matrix.variant }} / ${{ matrix.mode }} / Python ${{ matrix.python }} / repeat ${{ matrix.repeat }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python: ['3.12', '3.13']
        variant: [A, B]
        mode: [profiled, unprofiled]
        repeat: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MAISON_SCOPE_VARIANT: ${{ matrix.variant }}
      MAISON_SCOPE_PROFILE: ${{ matrix.mode == 'profiled' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - run: python -m pip check
      - name: Original workload, timings and audit even on assertion failure
        run: python -m pytest -q -s --tb=short app/tests/test_scope_experiment.py
