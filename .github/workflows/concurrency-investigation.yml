name: Concurrency investigation

# Branch-limited experiment; never deploys or replaces required CI.
on:
  push:
    branches: [fix/windows-concurrency]
    paths:
      - app/tests/scope_experiment.py
      - app/tests/test_scope_experiment.py
      - .github/workflows/concurrency-investigation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Paired scopes / Python ${{ matrix.python }} / repeat ${{ matrix.repeat }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        repeat: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      SCOPE_REPEAT: ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - run: python -m pip check
      - name: Same runner, fresh test DB per case; preserve every failed assertion
        shell: powershell
        run: |
          $cases = @(
            @{ Variant='A'; Profile='1' },
            @{ Variant='B'; Profile='1' },
            @{ Variant='B'; Profile='0' },
            @{ Variant='A'; Profile='0' }
          )
          if ($env:SCOPE_REPEAT -eq '2') { [array]::Reverse($cases) }
          $failed = $false
          foreach ($case in $cases) {
            $env:MAISON_SCOPE_VARIANT = $case.Variant
            $env:MAISON_SCOPE_PROFILE = $case.Profile
            & python -m pytest -q -s --tb=short app/tests/test_scope_experiment.py
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
