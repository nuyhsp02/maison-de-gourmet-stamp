name: B write scope validation
on:
  push:
    branches: [fix/transaction-write-scope]
    paths: ['app/**', 'tools/check_sqlite_runtime.py', '.github/workflows/write-scope-validation.yml']
permissions:
  contents: read
jobs:
  windows:
    name: Windows Python ${{ matrix.python }} repeat ${{ matrix.repeat }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        repeat: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.lock
      - name: Report actual engine; green tests do not certify runtime safety
        run: python tools/check_sqlite_runtime.py
      - run: python -m pytest -q -s --tb=short app/tests/test_load.py app/tests/test_write_scope.py
