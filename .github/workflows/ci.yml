name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**', 'docs/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  MAISON_HTTP_TESTS: '1'

jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.15.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-test.lock
            requirements-windows.lock
      - run: 'python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-test.lock'
      - name: Actual SQLite for compatibility evidence
        run: python tools/check_sqlite_runtime.py
      - name: Fixed SQLite required for Windows operating target
        if: matrix.os == 'windows-latest' && matrix.python == '3.15.2'
        run: python tools/check_sqlite_runtime.py --require-fixed
      - run: python -m pip check
      - name: Unchanged full suite (bounded diagnostic opt-in only on push)
        if: ${{ !(matrix.os == 'windows-latest' && matrix.python == '3.15.2' && github.event_name == 'push' && contains(github.event.head_commit.message, '[b-probe]')) }}
        run: python -m pytest -q app/tests tests
      - name: B diagnosis, same full suite and original raw load
        if: matrix.os == 'windows-latest' && matrix.python == '3.15.2' && github.event_name == 'push' && contains(github.event.head_commit.message, '[b-probe]')
        run: python tests/b_admission_probe.py --output b-admission-results.json
      - name: Retain only anonymous diagnostic aggregates
        if: always() && matrix.os == 'windows-latest' && matrix.python == '3.15.2' && github.event_name == 'push' && contains(github.event.head_commit.message, '[b-probe]')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b-admission-${{ github.run_id }}
          path: b-admission-results.json
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check app/static/app.js
          node --check app/static/collection-core.js
          node --check app/static/stamp-art.js
      - name: Browser logic and QR decoding
        run: node --test app/tests/scanner.test.cjs app/tests/app-flow.test.cjs

  powershell:
    name: Windows PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 parser and pure helpers
        shell: powershell
        run: '& .\tests\Check-PowerShell.ps1'

  public-source:
    name: Public source audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/audit_public.py --history

  required:
    name: Required checks
    if: always()
    needs: [python, frontend, powershell, public-source]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test group to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not succeed: ' + ', '.join(failed))
          print('All required checks passed.')
          PY
