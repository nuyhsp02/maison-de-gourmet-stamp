# Include once in nginx's http context on the dedicated DEMO host.
# Substitute the approved DNS name everywhere, including certificate paths.
log_format maison_demo '$time_iso8601 $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/maison-demo-access.log maison_demo;
    # Request-level errors can include the URI and Basic username.
    error_log /dev/null;
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log /var/log/nginx/maison-demo-access.log maison_demo;
    error_log /dev/null;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    return 421;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.example.invalid;
    ssl_certificate /etc/letsencrypt/live/demo.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/maison-demo-access.log maison_demo;
    error_log /dev/null;
    # Match PUBLIC_URL's exact authority and reject noncanonical ports.
    if ($http_host != demo.example.invalid) { return 421; }

    auth_basic "Maison private demo";
    auth_basic_user_file /etc/maison-demo/gate.htpasswd;
    client_max_body_size 4k;
    proxy_hide_header Cache-Control;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8875;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-By "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
    }
}
