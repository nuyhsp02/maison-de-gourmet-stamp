# Include once alongside DEMO in the http context. DEMO owns the default listeners.
log_format maison_prod '$time_iso8601 $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name gourmetstamp.kr www.gourmetstamp.kr;
    access_log /var/log/nginx/maison-prod-access.log maison_prod;
    error_log /dev/null;
    auth_basic off;
    if ($http_host !~* "^(?:www\.)?gourmetstamp\.kr(?::80)?$") { return 421; }

    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
        root /var/lib/maison-prod-acme;
        default_type text/plain;
        disable_symlinks on;
        try_files $uri =404;
    }
    location /.well-known/acme-challenge/ { return 404; }
    location / { return 308 https://gourmetstamp.kr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gourmetstamp.kr www.gourmetstamp.kr;
    ssl_certificate /etc/letsencrypt/live/gourmetstamp.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gourmetstamp.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/maison-prod-access.log maison_prod;
    error_log /dev/null;
    if ($ssl_server_name !~* "^(?:www\.)?gourmetstamp\.kr$") { return 421; }
    if ($http_host !~* "^(?:www\.)?gourmetstamp\.kr(?::443)?$") { return 421; }
    if ($host = www.gourmetstamp.kr) { return 308 https://gourmetstamp.kr$request_uri; }
    # Cancel any Basic Auth inherited from http. Staff roles are checked by Flask.
    auth_basic off;
    client_max_body_size 4k;
    proxy_hide_header Cache-Control;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8876;
        proxy_set_header Host gourmetstamp.kr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-By "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
    }
}
