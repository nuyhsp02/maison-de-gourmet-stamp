# Dedicated PROD host, in nginx's http context. Replace the reserved example with the approved hostname.
log_format maison_prod '$time_iso8601 $status $body_bytes_sent';
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 421;
}
server {
    listen 80;
    listen [::]:80;
    server_name store.example.invalid;
    access_log /var/log/nginx/maison-prod-access.log maison_prod;
    error_log /dev/null;
    return 308 https://store.example.invalid$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
    return 421;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name store.example.invalid;
    ssl_certificate /etc/maison-prod/tls/fullchain.pem;
    ssl_certificate_key /etc/maison-prod/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/maison-prod-access.log maison_prod;
    error_log /dev/null;
    if ($http_host != store.example.invalid) { return 421; }
    # Cancel any Basic Auth inherited from http. Staff roles are checked by Flask.
    auth_basic off;
    client_max_body_size 4k;
    proxy_hide_header Cache-Control;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8876;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-By "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
    }
}
