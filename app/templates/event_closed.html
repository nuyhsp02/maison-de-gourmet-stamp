<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <title>스탬프 카드 안내 · Maison de Gourmet</title>
</head>
<body>
  <main class="layout">
    <section class="intro">
      {% if closed %}
      <h1>행사가 종료되었습니다</h1>
      <p>스탬프 카드 조회와 기존 카드 찾기가 종료되었습니다. 참여해 주셔서 감사합니다.</p>
      {% else %}
      <h1>지금은 카드를 조회할 수 없습니다</h1>
      <p>잠시 후 다시 접속해 주세요.</p>
      {% endif %}
    </section>
  </main>
</body>
</html>
